<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestão de Frota Locada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: barra lateral de módulos + área de trabalho com resumo no topo e tabela operacional */
:root{
  --bg:#f3f5f7;--panel:#ffffff;--fg:#17212b;--muted:#5d6b78;--line:#dde3e9;
  --accent:#1f5f8b;--accent-soft:#e3eef6;
  --ok:#1d7a4e;--ok-soft:#e2f3ea;--warn:#a86410;--warn-soft:#fbefdc;--bad:#b3372e;--bad-soft:#f8e4e2;
  --plate:#ffffff;--plate-band:#1d4fa0;
  --f-body:"Figtree",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171d;--panel:#18212a;--fg:#e6ecf1;--muted:#93a2b0;--line:#2a3742;
  --accent:#6fb0dd;--accent-soft:#1c3346;
  --ok:#5cc792;--ok-soft:#17372a;--warn:#e3a54f;--warn-soft:#3a2a14;--bad:#ef7d73;--bad-soft:#3d1e1b;
  --plate:#e9edf1;--plate-band:#2a5fb8;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171d;--panel:#18212a;--fg:#e6ecf1;--muted:#93a2b0;--line:#2a3742;
  --accent:#6fb0dd;--accent-soft:#1c3346;
  --ok:#5cc792;--ok-soft:#17372a;--warn:#e3a54f;--warn-soft:#3a2a14;--bad:#ef7d73;--bad-soft:#3d1e1b;
  --plate:#e9edf1;--plate-band:#2a5fb8;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.app{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:210px 1fr;gap:24px}
@media (max-width:820px){.app{grid-template-columns:1fr}}
.brand{font-weight:600;font-size:17px;margin-bottom:4px}
.brand-sub{color:var(--muted);font-size:13px;margin-bottom:18px}
nav{display:flex;flex-direction:column;gap:2px}
@media (max-width:820px){nav{flex-direction:row;flex-wrap:wrap;gap:6px}}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:10px}
nav button:hover{color:var(--fg);background:var(--panel)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav .count{font-family:var(--f-mono);font-size:12px;opacity:.8}
.demo{margin-top:18px;font-size:12px;color:var(--warn);background:var(--warn-soft);padding:8px 10px;border-radius:8px}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
h1{font-size:22px;font-weight:600;margin:0;text-wrap:balance}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.kpi .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .val{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .hint{font-size:12px;color:var(--muted)}
.kpi.bad .val{color:var(--bad)}.kpi.ok .val{color:var(--ok)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:16px;font-weight:600;margin:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;text-align:right}th.num{text-align:right}
.sub{color:var(--muted);font-size:12px}
.plate{display:inline-flex;flex-direction:column;border:1.5px solid #222;border-radius:4px;overflow:hidden;background:var(--plate);color:#111;line-height:1;min-width:84px}
.plate i{display:block;height:5px;background:var(--plate-band)}
.plate b{font-family:var(--f-mono);font-weight:700;font-size:13px;letter-spacing:.08em;padding:3px 6px 4px;text-align:center}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}.p-neutral{background:var(--accent-soft);color:var(--accent)}
.btn{all:unset;cursor:pointer;font-size:13px;font-weight:500;padding:6px 12px;border-radius:7px;border:1px solid var(--line);color:var(--fg);background:var(--panel)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.btn.primary:hover{opacity:.9;color:var(--panel)}
.actions{display:flex;gap:6px}
.done{color:var(--muted);font-size:13px}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
form.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px}
@media (max-width:700px){form.grid{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);min-width:0}
.form-foot{grid-column:1/-1;display:flex;gap:10px;align-items:center}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:16px}
@media (max-width:600px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
.day{border:1px solid var(--line);border-radius:8px;padding:8px;min-height:84px;min-width:0}
.day.today{border-color:var(--accent)}
.day h3{font-size:12px;font-weight:500;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em}
.day .it{font-family:var(--f-mono);font-size:11px;padding:2px 5px;border-radius:4px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.brand-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.brand-row .brand{margin-bottom:0}
.theme-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--panel)}
.theme-btn:hover{color:var(--fg);border-color:var(--accent)}
.theme-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.theme-btn svg{width:14px;height:14px}
nav .ico{display:none}
nav .lab-s{display:none}
nav .ico svg{width:20px;height:20px;display:block;margin:0 auto}
@media (max-width:640px){nav .lab-l{display:none}nav .lab-s{display:inline}}
@media (max-width:640px){
  body{padding-block:14px calc(84px + env(safe-area-inset-bottom,0px))}
  .brand-sub{display:none}
  .brand{margin-bottom:10px}
  aside{display:flex;flex-direction:column}
  .demo{margin-top:0}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:20;flex-direction:row;flex-wrap:nowrap;gap:0;
    background:var(--panel);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  nav button{flex:1 1 0;min-width:0;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;position:relative;text-align:center}
  nav button .ico{display:block;font-size:20px;line-height:1}
  nav button .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  nav .count{position:absolute;top:2px;right:calc(50% - 22px);font-size:10px;background:var(--bad);color:var(--panel);border-radius:999px;padding:0 5px;opacity:1}
  nav .count.zero,nav button[data-v="locacoes"] .count,nav button[data-v="veiculos"] .count,nav button[data-v="proprietarios"] .count,nav button[data-v="locatarios"] .count{display:none}
  h1{font-size:20px}
  .head p{font-size:13px}
  .kpis{gap:8px}
  .kpi{padding:12px}
  .kpi .val{font-size:18px}
  .card-h{padding:12px}
  .filters{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:2px}
  .chip{white-space:nowrap}
  .tbl-wrap{overflow:visible}
  table,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tr{padding:12px;border-bottom:1px solid var(--line)}
  tr:last-child{border-bottom:0}
  td{border:0;padding:3px 0;white-space:normal;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right}
  td::before{content:attr(data-l);color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;text-align:left;flex:none}
  td.num{text-align:right}
  td:has(.actions){padding-top:8px}
  td:has(.actions)::before{display:none}
  .actions{width:100%}
  .actions .btn{flex:1;text-align:center;padding:10px 12px}
  .actions .done{width:100%;text-align:center}
  .week{grid-template-columns:repeat(7,72px);overflow-x:auto;padding:12px}
  .day{min-height:76px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>

<div class="app">
  <aside>
    <div class="brand-row"><div class="brand">Gestão de Frota</div><button class="theme-btn" id="theme-btn" type="button" aria-label="Alternar tema claro e escuro"></button></div>
    <div class="brand-sub">Administração de veículos locados</div>
    <nav id="nav"></nav>
    <div class="demo">Prévia de interface com dados fictícios. Nada aqui é salvo.</div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const HOJE = new Date(2026,9,22);
const DIAS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dt = d => d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
const TAXA = 100;

const proprietarios = [
  {id:'P1',nome:'Avante Locadora Ltda',cnpj:'12.345.678/0001-90',cidade:'Curitiba/PR',fone:'(41) 99812-4410',pix:'financeiro@avante.exemplo'},
  {id:'P2',nome:'Frota Sul Locações',cnpj:'98.765.432/0001-10',cidade:'São José dos Pinhais/PR',fone:'(41) 99733-2081',pix:'98.765.432/0001-10'},
  {id:'P3',nome:'Marcos Teixeira (PF)',cnpj:'CPF 321.654.987-00',cidade:'Colombo/PR',fone:'(41) 98840-1177',pix:'(41) 98840-1177'}
];
const veiculos = [
  {id:'V1',placa:'BRA2E19',modelo:'Onix 1.0 2023',cor:'Branco',prop:'P1'},
  {id:'V2',placa:'RTA4F82',modelo:'HB20 1.0 2022',cor:'Prata',prop:'P1'},
  {id:'V3',placa:'QWE7H30',modelo:'Argo 1.3 2023',cor:'Cinza',prop:'P2'},
  {id:'V4',placa:'PRK1C56',modelo:'Kwid 1.0 2024',cor:'Branco',prop:'P2'},
  {id:'V5',placa:'MTX9B04',modelo:'Logan 1.6 2022',cor:'Preto',prop:'P3'},
  {id:'V6',placa:'GHJ3D71',modelo:'Mobi 1.0 2023',cor:'Vermelho',prop:'P1'}
];
const locatarios = [
  {id:'L1',nome:'Rafael Souza Lima',cpf:'123.456.789-01',fone:'(41) 99101-2233',app:'Uber / 99',cidade:'Curitiba/PR'},
  {id:'L2',nome:'Juliana Prado',cpf:'234.567.890-12',fone:'(41) 99202-3344',app:'Uber',cidade:'Pinhais/PR'},
  {id:'L3',nome:'Anderson Kruger',cpf:'345.678.901-23',fone:'(41) 99303-4455',app:'99',cidade:'Curitiba/PR'},
  {id:'L4',nome:'Patrícia Mendes',cpf:'456.789.012-34',fone:'(41) 99404-5566',app:'Uber',cidade:'Araucária/PR'},
  {id:'L5',nome:'Diego Ferreira',cpf:'567.890.123-45',fone:'(41) 99505-6677',app:'Uber / 99',cidade:'Curitiba/PR'}
];
const locacoes = [
  {id:'C1',veic:'V1',loc:'L1',valor:600,dia:2,inicio:'01/09/2026'},
  {id:'C2',veic:'V2',loc:'L2',valor:600,dia:3,inicio:'08/09/2026'},
  {id:'C3',veic:'V3',loc:'L3',valor:650,dia:2,inicio:'15/09/2026'},
  {id:'C4',veic:'V4',loc:'L4',valor:550,dia:4,inicio:'22/09/2026'},
  {id:'C5',veic:'V5',loc:'L5',valor:600,dia:5,inicio:'29/09/2026'}
];

function venc(dia,semanasAtras){
  const d=new Date(HOJE); const diff=d.getDay()-dia; d.setDate(d.getDate()-diff-7*semanasAtras); return d;
}
let cobrancas=[];let n=1;
locacoes.forEach(l=>{
  for(let s=3;s>=0;s--){
    const d=venc(l.dia,s); if(d<new Date(2026,9,1)&&s===3) continue;
    let pago=d<HOJE, rep=pago&&s>0;
    if(l.id==='C3'&&s<=1) {pago=false;rep=false}
    if(l.id==='C2'&&s===0) {pago=true;rep=false}
    if(d>HOJE){pago=false;rep=false}
    cobrancas.push({id:'#'+String(n++).padStart(4,'0'),loc:l.id,venc:d,valor:l.valor,pago,rep});
  }
});

const by=(arr,id)=>arr.find(x=>x.id===id);
function status(c){
  if(c.pago&&c.rep) return ['Concluída','p-ok'];
  if(c.pago) return ['Pago, falta repassar','p-neutral'];
  if(c.venc<HOJE) return ['Atrasada','p-bad'];
  if(c.venc.toDateString()===HOJE.toDateString()) return ['Vence hoje','p-warn'];
  return ['A vencer','p-warn'];
}
const plate=p=>`<span class="plate" aria-label="Placa ${p}"><i></i><b>${p.slice(0,3)} ${p.slice(3)}</b></span>`;

let view='painel', filtro='todas';
const VIEWS=[['painel','Painel'],['cobrancas','Cobranças'],['locacoes','Locações'],['veiculos','Veículos'],['proprietarios','Proprietários'],['locatarios','Locatários']];
const sv=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICO={
  painel:sv('<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'),
  cobrancas:sv('<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M7 9.5v5M17 9.5v5"/>'),
  locacoes:sv('<path d="M8 7h11l-3-3M16 17H5l3 3"/>'),
  veiculos:sv('<path d="M5 16V11l2-4h10l2 4v5"/><path d="M3 16h18v2H3z"/><circle cx="7.5" cy="18" r="1.5"/><circle cx="16.5" cy="18" r="1.5"/>'),
  proprietarios:sv('<path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/>'),
  locatarios:sv('<circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-5.5 7-5.5s6 1.5 7 5.5"/>')
};
const CURTO={cobrancas:'Cobrar',proprietarios:'Donos',locatarios:'Motoristas'};
const counts=()=>({cobrancas:cobrancas.filter(c=>!c.pago&&c.venc<=HOJE).length,locacoes:locacoes.length,veiculos:veiculos.length,proprietarios:proprietarios.length,locatarios:locatarios.length});

function renderNav(){
  const c=counts();
  document.getElementById('nav').innerHTML=VIEWS.map(([k,t])=>`<button data-v="${k}" aria-current="${view===k}"><span class="ico" aria-hidden="true">${ICO[k]}</span><span class="lab"><span class="lab-l">${t}</span><span class="lab-s">${CURTO[k]||t}</span></span>${c[k]!=null?`<span class="count ${c[k]===0?'zero':''}">${c[k]}</span>`:''}</button>`).join('');
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();window.scrollTo(0,0)});
}
function kpis(){
  const sem0=new Date(HOJE);sem0.setDate(HOJE.getDate()-HOJE.getDay());const sem1=new Date(sem0);sem1.setDate(sem0.getDate()+7);
  const semana=cobrancas.filter(c=>c.venc>=sem0&&c.venc<sem1);
  const atras=cobrancas.filter(c=>!c.pago&&c.venc<HOJE);
  const arep=cobrancas.filter(c=>c.pago&&!c.rep);
  const taxa=semana.filter(c=>c.pago).length*TAXA;
  return `<div class="kpis">
   <div class="kpi"><div class="lbl">Recebido na semana</div><div class="val">${brl(semana.filter(c=>c.pago).reduce((a,c)=>a+c.valor,0))}</div><div class="hint">de ${brl(semana.reduce((a,c)=>a+c.valor,0))} previstos</div></div>
   <div class="kpi bad"><div class="lbl">Em atraso</div><div class="val">${brl(atras.reduce((a,c)=>a+c.valor,0))}</div><div class="hint">${atras.length} cobrança(s)</div></div>
   <div class="kpi"><div class="lbl">A repassar</div><div class="val">${brl(arep.reduce((a,c)=>a+c.valor-TAXA,0))}</div><div class="hint">${arep.length} repasse(s) pendente(s)</div></div>
   <div class="kpi ok"><div class="lbl">Taxa da semana</div><div class="val">${brl(taxa)}</div><div class="hint">R$ 100 por veículo pago</div></div></div>`;
}
function tabelaCobrancas(lista){
  return `<div class="tbl-wrap"><table><thead><tr><th>Nº</th><th>Vencimento</th><th>Veículo</th><th>Locatário</th><th>Proprietário</th><th class="num">Valor</th><th class="num">Repasse</th><th>Status</th><th>Ações</th></tr></thead><tbody>
  ${lista.map(c=>{const l=by(locacoes,c.loc),v=by(veiculos,l.veic),lo=by(locatarios,l.loc),p=by(proprietarios,v.prop);const[s,cl]=status(c);
  return `<tr><td class="sub">${c.id}</td><td>${dt(c.venc)} <span class="sub">${DIAS[c.venc.getDay()]}</span></td><td>${plate(v.placa)}</td><td>${lo.nome}<div class="sub">${lo.fone}</div></td><td>${p.nome}</td><td class="num">${brl(c.valor)}</td><td class="num">${brl(c.valor-TAXA)}</td><td><span class="pill ${cl}">${s}</span></td>
  <td><div class="actions">${!c.pago?`<button class="btn primary" data-a="pago" data-id="${c.id}">Dar baixa</button>`:!c.rep?`<button class="btn" data-a="rep" data-id="${c.id}">Marcar repassado</button>`:`<span class="done">Finalizada</span>`}</div></td></tr>`}).join('')}
  </tbody></table></div>`;
}
function semanaGrid(){
  const ini=new Date(HOJE);ini.setDate(HOJE.getDate()-HOJE.getDay());
  return `<div class="week">${[...Array(7)].map((_,i)=>{const d=new Date(ini);d.setDate(ini.getDate()+i);
   const its=cobrancas.filter(c=>c.venc.toDateString()===d.toDateString());
   return `<div class="day ${d.toDateString()===HOJE.toDateString()?'today':''}"><h3>${DIAS[i]} ${dt(d)}</h3>${its.map(c=>{const v=by(veiculos,by(locacoes,c.loc).veic);const[,cl]=status(c);return `<div class="it pill ${cl}">${v.placa}</div>`}).join('')}</div>`}).join('')}</div>`;
}
function render(){
  renderNav();const m=document.getElementById('main');let h='';
  if(view==='painel'){
    const pend=cobrancas.filter(c=>(!c.pago&&c.venc<=HOJE)||(c.pago&&!c.rep)).sort((a,b)=>a.venc-b.venc);
    h=`<div class="head"><div><h1>Painel da semana</h1><p>Quinta-feira, 22 de outubro de 2026</p></div></div>${kpis()}
    <div class="card"><div class="card-h"><h2>Vencimentos da semana</h2><span class="sub">Cada veículo vence no seu dia fixo</span></div>${semanaGrid()}</div>
    <div class="card"><div class="card-h"><h2>Precisa de ação</h2><span class="sub">${pend.length} item(ns)</span></div>${tabelaCobrancas(pend)}</div>`;
  }
  if(view==='cobrancas'){
    const F={todas:()=>true,abertas:c=>!c.pago,atrasadas:c=>!c.pago&&c.venc<HOJE,repassar:c=>c.pago&&!c.rep,concluidas:c=>c.pago&&c.rep};
    const lista=cobrancas.filter(F[filtro]).sort((a,b)=>b.venc-a.venc);
    h=`<div class="head"><div><h1>Cobranças semanais</h1><p>Geradas a partir de cada locação ativa. A baixa registra o recebimento; o repasse registra o envio ao proprietário.</p></div></div>
    <div class="card"><div class="card-h"><div class="filters">${[['todas','Todas'],['abertas','Em aberto'],['atrasadas','Atrasadas'],['repassar','A repassar'],['concluidas','Concluídas']].map(([k,t])=>`<button class="chip" data-f="${k}" aria-pressed="${filtro===k}">${t}</button>`).join('')}</div><span class="sub">${lista.length} cobrança(s)</span></div>${tabelaCobrancas(lista)}</div>`;
  }
  if(view==='locacoes'){
    h=`<div class="head"><div><h1>Locações ativas</h1><p>Vínculo entre veículo e locatário, com valor e dia fixo de vencimento.</p></div></div>
    <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Veículo</th><th>Locatário</th><th>Proprietário</th><th>Vencimento</th><th class="num">Semanal</th><th class="num">Taxa</th><th class="num">Repasse</th><th>Desde</th></tr></thead><tbody>
    ${locacoes.map(l=>{const v=by(veiculos,l.veic),lo=by(locatarios,l.loc),p=by(proprietarios,v.prop);return `<tr><td>${plate(v.placa)} <span class="sub">${v.modelo}</span></td><td>${lo.nome}</td><td>${p.nome}</td><td>Toda ${['domingo','segunda','terça','quarta','quinta','sexta','sábado'][l.dia]}</td><td class="num">${brl(l.valor)}</td><td class="num">${brl(TAXA)}</td><td class="num">${brl(l.valor-TAXA)}</td><td class="sub">${l.inicio}</td></tr>`}).join('')}
    </tbody></table></div></div>`;
  }
  if(view==='veiculos'){
    h=`<div class="head"><div><h1>Veículos</h1><p>Cada veículo pertence a um proprietário e pode estar locado ou disponível.</p></div></div>
    <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Placa</th><th>Modelo</th><th>Cor</th><th>Proprietário</th><th>Situação</th></tr></thead><tbody>
    ${veiculos.map(v=>{const l=locacoes.find(x=>x.veic===v.id);return `<tr><td>${plate(v.placa)}</td><td>${v.modelo}</td><td>${v.cor}</td><td>${by(proprietarios,v.prop).nome}</td><td>${l?`<span class="pill p-neutral">Locado a ${by(locatarios,l.loc).nome.split(' ')[0]}</span>`:'<span class="pill p-ok">Disponível</span>'}</td></tr>`}).join('')}
    </tbody></table></div></div>`;
  }
  if(view==='proprietarios'){
    h=`<div class="head"><div><h1>Proprietários</h1><p>Donos dos veículos administrados. O Pix é usado no repasse semanal.</p></div></div>
    <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Nome / razão social</th><th>CNPJ / CPF</th><th>Cidade</th><th>Telefone</th><th>Chave Pix</th><th class="num">Veículos</th><th class="num">A repassar</th></tr></thead><tbody>
    ${proprietarios.map(p=>{const vs=veiculos.filter(v=>v.prop===p.id).map(v=>v.id);const ar=cobrancas.filter(c=>c.pago&&!c.rep&&vs.includes(by(locacoes,c.loc).veic)).reduce((a,c)=>a+c.valor-TAXA,0);return `<tr><td>${p.nome}</td><td class="sub">${p.cnpj}</td><td>${p.cidade}</td><td>${p.fone}</td><td class="sub">${p.pix}</td><td class="num">${vs.length}</td><td class="num">${brl(ar)}</td></tr>`}).join('')}
    </tbody></table></div></div>`;
  }
  if(view==='locatarios'){
    h=`<div class="head"><div><h1>Locatários</h1><p>Motoristas que alugam os veículos. Documentos (CNH, comprovante) seriam anexados no cadastro.</p></div></div>
    <div class="card"><div class="card-h"><h2>Novo locatário</h2></div>
    <form class="grid" id="f" novalidate>
      <label>Nome completo<input id="f-nome" placeholder="Ex.: Carla Ribeiro"></label>
      <label>CPF<input id="f-cpf" placeholder="000.000.000-00"></label>
      <label>Telefone<input id="f-fone" placeholder="(41) 90000-0000"></label>
      <label>Cidade<input id="f-cid" placeholder="Curitiba/PR"></label>
      <label>Aplicativo<select id="f-app"><option>Uber</option><option>99</option><option>Uber / 99</option><option>Uso pessoal</option></select></label>
      <label>CNH (arquivo)<input id="f-cnh" type="file" accept="image/*,application/pdf"></label>
      <div class="form-foot"><button class="btn primary" type="submit">Cadastrar locatário</button><span class="err" id="f-err" hidden></span></div>
    </form></div>
    <div class="card"><div class="tbl-wrap"><table><thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>Aplicativo</th><th>Cidade</th><th>Veículo</th></tr></thead><tbody>
    ${locatarios.map(l=>{const c=locacoes.find(x=>x.loc===l.id);return `<tr><td>${l.nome}</td><td class="sub">${l.cpf}</td><td>${l.fone}</td><td>${l.app}</td><td>${l.cidade}</td><td>${c?plate(by(veiculos,c.veic).placa):'<span class="sub">Sem locação</span>'}</td></tr>`}).join('')}
    </tbody></table></div></div>`;
  }
  m.innerHTML=h;
  m.querySelectorAll('table').forEach(t=>{const ls=[...t.querySelectorAll('thead th')].map(th=>th.textContent);
    t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>td.setAttribute('data-l',ls[i]||'')))});
  m.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const c=cobrancas.find(x=>x.id===b.dataset.id);if(b.dataset.a==='pago'){c.pago=true;toast('Baixa registrada em '+c.id)}else{c.rep=true;toast('Repasse registrado em '+c.id)}render()});
  m.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filtro=b.dataset.f;render()});
  const f=document.getElementById('f');
  if(f){f.oninput=()=>document.getElementById('f-err').hidden=true;
   f.onsubmit=e=>{e.preventDefault();const nome=f.querySelector('#f-nome').value.trim(),cpf=f.querySelector('#f-cpf').value.trim();const err=document.getElementById('f-err');
    if(!nome||!cpf){err.textContent='Preencha nome e CPF para cadastrar.';err.hidden=false;return}
    locatarios.push({id:'L'+(locatarios.length+1),nome,cpf,fone:f.querySelector('#f-fone').value||'Não informado',app:f.querySelector('#f-app').value,cidade:f.querySelector('#f-cid').value||'Não informada'});
    toast('Locatário cadastrado');render()}}
}
let tt;function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2200)}
(function(){
  const root=document.documentElement,btn=document.getElementById('theme-btn');
  const sol='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const lua='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
  const atual=()=>root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const pinta=()=>{const t=atual();btn.innerHTML=t==='dark'?sol+'Claro':lua+'Escuro'};
  try{const s=localStorage.getItem('tema');if(s)root.dataset.theme=s}catch(e){}
  btn.onclick=()=>{const t=atual()==='dark'?'light':'dark';root.dataset.theme=t;try{localStorage.setItem('tema',t)}catch(e){}pinta()};
  pinta();
})();
render();
</script>
